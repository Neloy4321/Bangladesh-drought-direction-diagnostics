name: Verify Paper 2 evidence tables
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate reproducibility Python syntax
        run: python -m compileall -q src scripts
      - name: Recompute public summary denominators and integrity tests
        run: python scripts/verify_results.py
